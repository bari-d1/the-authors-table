<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJK Site — Design Mockups</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    main {
      width: 100%;
      max-width: 640px;
      padding: 48px 32px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    p.lede {
      margin: 0 0 32px;
      color: #6e6e73;
      font-size: 16px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 20px 24px;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.10);
    }
    a.card .title {
      font-size: 17px;
      font-weight: 600;
    }
    a.card .desc {
      margin-top: 4px;
      font-size: 14px;
      color: #6e6e73;
    }
  </style>
</head>
<body>
  <main>
    <h1>PJK Site — Design Mockups</h1>
    <p class="lede">Reference mockups for the upcoming book launch.</p>
    <ul>
      <li>
        <a class="card" href="landing/Landing.dc.html">
          <div class="title">Landing page</div>
          <div class="desc">Book launch landing page with the release grid.</div>
        </a>
      </li>
      <li>
        <a class="card" href="book-discussion/Thread.dc.html">
          <div class="title">Book discussion + quote share</div>
          <div class="desc">Chapter discussion thread with quote sharing.</div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
